function openPrjModal(){ $('prjNameInp').value=app.name; $('prjDateInp').value=app.date; openModal('prjModal'); $('prjNameInp').focus(); }
function savePrj(){ app.name=$('prjNameInp').value.trim()||'活动行程地图'; app.date=$('prjDateInp').value; closeModal('prjModal'); renderPanel(); toast('已保存'); }

/* ---- 导出 / 导入 ---- */
function exportData(){
  const data={app:'event-map',version:2,name:app.name,date:app.date,cats:app.cats,points:app.points,routes:app.routes,stops:app.stops,zones:app.zones,center:[map.getCenter().lat,map.getCenter().lng],zoom:map.getZoom(),base:activeBase};
  download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),(app.name||'活动行程')+'.行程.json');
  toast('已导出行程数据');
}
function importData(input){
  const file=input.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const obj=JSON.parse(rd.result);
    if(!obj||obj.app!=='event-map'||!obj.cats){ throw new Error('不是有效的行程数据文件'); }
    app.name=obj.name||'活动行程地图'; app.date=obj.date||'';
    app.cats=obj.cats||[]; app.points=obj.points||[]; app.routes=obj.routes||[]; app.stops=obj.stops||[]; app.zones=obj.zones||[];
    app.cats.forEach(c=>{ if(c.detail==null) c.detail=''; });
    if(!app.cats.length) app.cats.push({id:'c0',name:'全体嘉宾',color:'#2f6feb',detail:''});
    evSelectedId=null;
    renderAll(); renderPanel();
    if(obj.center&&Array.isArray(obj.center)){ map.setView(obj.center,obj.zoom||map.getZoom()); }
    if(obj.base&&baseLayers[obj.base]){ map.removeLayer(baseLayers[activeBase]); activeBase=obj.base; baseLayers[activeBase].addTo(map); renderSourcesTab(); }
    updateStatus(); toast('成功导入：'+app.points.length+' 点位 / '+app.routes.length+' 路线 / '+app.stops.length+' 行程');
  }catch(err){ toast('导入失败：'+err.message,true); } };
  rd.readAsText(file); input.value='';
}

/* =================================================================
 * 路线规划（起 → 终 自动规划，高德 / 腾讯 开放服务可选，可手动取点）
 * ================================================================= */
const AMAP_DEF='YOUR_AMAP_KEY';
const TX_DEF='YOUR_TENCENT_KEY';
let rpPickTarget=null, rpRoutes=[], rpNames={from:'',to:''}, rpTarget='event';
function amapKey(){ return ($('rpAmapKey').value.trim()||localStorage.getItem('amap_key')||AMAP_DEF); }
function txKey(){ return ($('rpTxKey').value.trim()||localStorage.getItem('tx_key')||TX_DEF); }
function openRpModal(target){
  rpTarget=target||'event';
  $('rpProv').value=localStorage.getItem('geo_prov')||'amap';
  $('rpAmapKey').value=localStorage.getItem('amap_key')||AMAP_DEF;
  $('rpTxKey').value=localStorage.getItem('tx_key')||TX_DEF;
  $('rpResult').innerHTML='';
  if(rpTarget==='annot'&&draw&&draw.tool==='route'&&draw.pts&&draw.pts.length>=2){
    const a=draw.pts[0], b=draw.pts[draw.pts.length-1];
    $('rpFrom').value=a[1].toFixed(6)+', '+a[0].toFixed(6);
    $('rpTo').value=b[1].toFixed(6)+', '+b[0].toFixed(6);
    $('rpMode').value='driving';
  } else { $('rpFrom').value=''; $('rpTo').value=''; $('rpMode').value='driving'; }
  openModal('rpModal');
}
function rpPick(which){ rpPickTarget=which; toast('请在地图上点击'+((which==='from')?'起点':'终点')); }
function rpSet(which,ll){ rpPickTarget=null; $(which==='from'?'rpFrom':'rpTo').value=ll.lng.toFixed(6)+', '+ll.lat.toFixed(6); toast('已取点：'+ll.lng.toFixed(5)+', '+ll.lat.toFixed(5)); }
function jsonp(url,cbName){
  return new Promise((res,rej)=>{
    window[cbName]=d=>{ delete window[cbName]; const s=document.getElementById('__rjsonp'); if(s)s.remove(); res(d); };
    const s=document.createElement('script'); s.id='__rjsonp';
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cbName;
    s.onerror=()=>{ delete window[cbName]; const ss=document.getElementById('__rjsonp'); if(ss)ss.remove(); rej(0); };
    document.head.appendChild(s);
  });
}
function amapGeo(addr,key){
  return jsonp('https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(addr)+'&key='+encodeURIComponent(key),'__amg_'+Math.floor(Math.random()*1e6))
    .then(d=>{ if(d.status!=='1'||!d.geocodes||!d.geocodes.length) throw 0; const p=d.geocodes[0].location.split(','); return [parseFloat(p[1]),parseFloat(p[0])]; });
}
function txGeo(addr,key){
  return jsonp('https://apis.map.qq.com/ws/geocoder/v1/?address='+encodeURIComponent(addr)+'&key='+encodeURIComponent(key),'__txg_'+Math.floor(Math.random()*1e6))
    .then(d=>{ if(d.status!==0||!d.result||!d.result.location) throw 0; return [d.result.location.lat,d.result.location.lng]; });
}
function geoResolve(v){
  v=v.trim(); if(!v) return Promise.reject(0);
  const m=coordMatch(v);
  if(m){ const lng=m[1],lat=m[2]; return Promise.resolve([lat,lng]); }
  return amapPoi(v).then(pois=>{ if(pois&&pois.length) return [pois[0].lat,pois[0].lng]; return amapGeo(v); });
}
function coordMatch(v){ return v.replace(/[，]/g,',').match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/); }
function amapPoi(q){
  return jsonp('https://restapi.amap.com/v3/place/text?keywords='+encodeURIComponent(q)+'&key='+encodeURIComponent(amapKey())+'&offset=5&page=1&extensions=base','__amp_'+Math.floor(Math.random()*1e6))
    .then(d=>{ if(d.status!=='1'||!d.pois||!d.pois.length) throw 0;
      return d.pois.slice(0,5).map(p=>{ const loc=(p.location||'').split(','); if(loc.length<2) return null; return {name:p.name,addr:p.address||'',lat:parseFloat(loc[1]),lng:parseFloat(loc[0])}; }).filter(Boolean); });
}
function resolveCands(v){
  v=v.trim(); if(!v) return Promise.resolve({q:v,points:[]});
  const m=coordMatch(v);
  if(m){ const lng=parseFloat(m[1]),lat=parseFloat(m[2]); if(Math.abs(lng)<=180&&Math.abs(lat)<=85) return Promise.resolve({q:v,points:[{name:'坐标 '+lng.toFixed(5)+', '+lat.toFixed(5),addr:'',lat,lng}]}); }
  return amapPoi(v).then(pois=>{
    if(pois&&pois.length) return {q:v,points:pois};
    return amapGeo(v).then(ll=>({q:v,points:[{name:v,addr:'',lat:ll[0],lng:ll[1]}]})).catch(()=>({q:v,points:[]}));
  }).catch(()=>({q:v,points:[]}));
}
function amapDir(A,B,mode,key){
  const ep={driving:'driving',walking:'walking',cycling:'bicycling'}[mode]||'driving';
  return jsonp('https://restapi.amap.com/v3/direction/'+ep+'?origin='+A[1]+','+A[0]+'&destination='+B[1]+','+B[0]+'&extensions=all&strategy=0&key='+encodeURIComponent(key),'__amd_'+Math.floor(Math.random()*1e6))
    .then(d=>{ if(d.status!=='1'||!d.route||!d.route.paths||!d.route.paths.length) throw 0;
      return d.route.paths.map((p,i)=>{ let coords=[]; (p.steps||[]).forEach(st=>{ if(st.polyline) st.polyline.split(';').forEach(pp=>{ const q=pp.split(','); if(q.length===2) coords.push([parseFloat(q[1]),parseFloat(q[0])]); }); });
        return {i:i+1,distance:p.distance,duration:p.duration,coords}; }).filter(r=>r.coords.length>1); });
}
function txDir(A,B,mode,key){
  const ep={driving:'driving',walking:'walking',cycling:'bicycling'}[mode]||'driving';
  return jsonp('https://apis.map.qq.com/ws/direction/v1/'+ep+'/?from='+A[0]+','+A[1]+'&to='+B[0]+','+B[1]+'&key='+encodeURIComponent(key),'__txd_'+Math.floor(Math.random()*1e6))
    .then(d=>{ if(d.status!==0||!d.result||!d.result.routes||!d.result.routes.length) throw 0;
      return d.result.routes.map((r,i)=>({i:i+1,distance:r.distance,duration:r.duration,coords:(r.polyline||[]).map(pt=>[pt.lat,pt.lng])})).filter(r=>r.coords.length>1); });
}
function planRoute(A,B,mode){
  const prov=($('rpProv').value||localStorage.getItem('geo_prov')||'amap');
  if(prov==='tx'){
    return txDir(A,B,mode,txKey()).then(r=>({routes:r,used:'tx'})).catch(()=>amapDir(A,B,mode,amapKey()).then(r=>({routes:r,used:'amap'})));
  }
  return amapDir(A,B,mode,amapKey()).then(r=>({routes:r,used:'amap'})).catch(()=>txDir(A,B,mode,txKey()).then(r=>({routes:r,used:'tx'})));
}
function fmtDur(s){ s=Math.round(s||0); const h=Math.floor(s/3600),m=Math.floor(s%3600/60); return h?`${h} 小时 ${m} 分`:(m+' 分钟'); }
async function rpPlan(){
  const box=$('rpResult');
  localStorage.setItem('geo_prov',$('rpProv').value);
  localStorage.setItem('amap_key',$('rpAmapKey').value.trim());
  localStorage.setItem('tx_key',$('rpTxKey').value.trim());
  const fromV=$('rpFrom').value.trim(), toV=$('rpTo').value.trim();
  if(!fromV||!toV){ toast('请填写起点和终点',true); return; }
  rpNames={from:fromV,to:toV};
  box.innerHTML='<div class="desc" style="color:var(--muted)">正在搜索起点/终点…</div>';
  const aRes=await resolveCands(fromV), bRes=await resolveCands(toV);
  if(!aRes.points.length){ box.innerHTML='<div class="desc" style="color:var(--danger)">起点未找到匹配，请输入更准确的地名，或 经度,纬度，或点击「地图取点」</div>'; return; }
  if(!bRes.points.length){ box.innerHTML='<div class="desc" style="color:var(--danger)">终点未找到匹配，请输入更准确的地名，或 经度,纬度，或点击「地图取点」</div>'; return; }
  window.__rpSel={a:aRes,b:bRes};
  const cand=(res,key)=>{
    return `<div class="rp-cand"><div class="rp-cand-t">${key==='a'?'起点':'终点'} · ${esc(res.q)}（${res.points.length} 个匹配）</div>
      ${res.points.map((p,i)=>`<label class="rp-opt"><input type="radio" name="rp${key}" value="${i}" ${i===0?'checked':''}><span>${esc(p.name)}${p.addr?' · '+esc(p.addr):''}</span><em>${p.lng.toFixed(5)}, ${p.lat.toFixed(5)}</em></label>`).join('')}</div>`;
  };
  box.innerHTML=cand(aRes,'a')+cand(bRes,'b')
    +`<button class="big-btn primary" onclick="rpPlanGo()" style="margin-top:10px">规划路线</button>
      <div id="rpPlanOut"></div>
      <div class="desc" style="color:var(--muted)">先在上方为起点/终点各选一个匹配点，再规划；多条方案可切换。</div>`;
}
function rpPlanGo(){
  const aRes=window.__rpSel.a, bRes=window.__rpSel.b;
  if(!aRes||!bRes) return;
  const aEl=document.querySelector('input[name="rpa"]:checked'), bEl=document.querySelector('input[name="rpb"]:checked');
  if(!aEl||!bEl){ toast('请先选择起点和终点',true); return; }
  const A=aRes.points[parseInt(aEl.value)]||aRes.points[0], B=bRes.points[parseInt(bEl.value)]||bRes.points[0];
  if(!A||!B) return;
  const out=$('rpPlanOut');
  out.innerHTML='<div class="desc" style="color:var(--muted)">正在规划路线…</div>';
  const modeV=$('rpMode').value;
  planRoute([A.lat,A.lng],[B.lat,B.lng],modeV).then(res=>{
    const routes=res.routes;
    if(!routes.length){ out.innerHTML='<div class="desc" style="color:var(--danger)">没有可用路线</div>'; return; }
    rpRoutes=routes;
    const provName=(res.used==='tx')?'腾讯路网':'高德路网';
    out.innerHTML=routes.map(r=>`
      <div class="rp-item">
        <div class="rp-head"><span class="rp-num">${r.i}</span><b style="font-size:13.5px">方案 ${r.i}</b>
          <button class="rp-pick" onclick="rpChoose(${r.i-1})">确定使用</button></div>
        <div class="rp-meta">全程 ${fmtDist(r.distance)} · 约 ${fmtDur(r.duration)} · ${provName}</div>
      </div>`).join('')+`<div class="desc" style="color:var(--muted)">可切换选择不同方案，点击「确定使用」加入路线列表。</div>`;
  }).catch(()=>{ out.innerHTML='<div class="desc" style="color:var(--danger)">路线规划失败：请检查 key 是否有效、服务是否开启，或换一家服务</div>'; });
}
function rpChoose(idx){
  const r=rpRoutes[idx]; if(!r) return;
  const name=(rpNames.from?rpNames.from+' → ':'' )+(rpNames.to||'');
  if(rpTarget==='annot'){
    commit({type:'route',latlngs:r.coords,color:PALETTE[5],weight:4,dash:'',label:name||'规划路线'});
    closeModal('rpModal');
    toast('已添加规划路线');
    return;
  }
  addRouteCommit({name:name||'规划路线',latlngs:r.coords});
  closeModal('rpModal');
  panelTab='routes'; evRenderPanel();
  toast('已添加规划路线');
}

/* =================================================================
 * 共享：顶栏 / 键盘 / 弹窗绑定
 * ================================================================= */
function bindSharedUI(){
  $('modeAnnot').addEventListener('click',()=>switchMode('annot'));
  $('modeEvent').addEventListener('click',()=>switchMode('event'));
  $('btnMyLoc').addEventListener('click',toggleMyLoc);
  $('btnUndo').addEventListener('click',undo);
  $('btnExportAnnot').addEventListener('click',exportProject);
  $('btnPrj').addEventListener('click',openPrjModal);
  $('btnExportEvent').addEventListener('click',exportData);
  $('togglePanel').addEventListener('click',togglePanel);
  $('drawDone').addEventListener('click',()=>{ if(mode==='annot') annotFinishDraw(); else evFinishDraw(); });
  $('drawCancel').addEventListener('click',()=>{ if(mode==='annot') annotCancelDraw(true); else evCancelDraw(true); });
  $('drawPlan').addEventListener('click',()=>{ if(mode==='annot') openRpModal('annot'); else openRpModal('event'); });
  $('btnLocate').addEventListener('click',locate);
  $('locLng').addEventListener('keydown',e=>{ if(e.key==='Enter') locate(); });
  $('locLat').addEventListener('keydown',e=>{ if(e.key==='Enter') locate(); });
  document.querySelectorAll('.modal-mask').forEach(m=>m.addEventListener('mousedown',e=>{ if(e.target===m) m.classList.add('hidden'); }));
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    if(e.key==='Enter'){ if(mode==='annot'&&draw) annotFinishDraw(); else if(mode==='event'&&evDraw) evFinishDraw(); }
    else if(e.key==='Escape'){ if(mode==='annot'&&draw) annotCancelDraw(true); else if(mode==='event'&&evDraw) evCancelDraw(true); }
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ if(mode==='annot'){ e.preventDefault(); undo(); } }
    else if(e.key==='Delete'||e.key==='Backspace'){
      if(mode==='annot'&&selectedId) deleteFeature(selectedId);
      else if(mode==='event'&&evSelectedId){
        if(pointById(evSelectedId)){ ptEditId=evSelectedId; delPoint(); }
        else if(routeById(evSelectedId)){ rtEditId=evSelectedId; delRoute(); }
        else if(zoneById(evSelectedId)){ znEditId=evSelectedId; delZone(); }
      }
    }
  });
}
(function boot(){
  initMap();
  pv=L.layerGroup().addTo(map);
  evLayer=L.layerGroup().addTo(map);
  myLayer=L.layerGroup().addTo(map);
  renderToolbar();
  bindSharedUI();
  renderPanel();
})();
</script>
